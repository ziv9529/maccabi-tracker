name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. Re-enabling them through the API resets that timer without
# creating commits.
on:
  schedule:
    - cron: '17 3 1 * *' # monthly
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in check.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf}/enable"
          done
